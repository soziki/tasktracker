spring.application.name=tasktracker

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost:5432}/${DB_SCHEMA:taskdb}
spring.datasource.username=${DB_USER:taskuser}
spring.datasource.password=${DB_PASSWORD:taskpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/myrealm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/myrealm/protocol/openid-connect/certs}

server.port=8080  

jwt.auth.converter.resource-id = myclient
jwt.auth.converter.principle-attribute = preferred_username